<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-site-verification" content="HCp5SiHShxJy-EZFMK2LDBsROqk4npXwuUQ0F0PKtUw" />
  <meta
    name="description"
    content="Browse and book community centres, sports clubs, and local activities across Ireland — halls, classes, kids' clubs, pickup games, and more, all in one place."
  />
  <!-- Safe-default fallback only: server/src/index.ts's catch-all handler
       rewrites this tag (and <title> above) per-route via
       server/src/ogMeta.ts's injectOgTags() before serving this file — the
       marketing pages (see MARKETING_PAGES there) get "index, follow",
       everything else stays "noindex, nofollow". This static value is what
       ships only if that rewrite ever fails/is bypassed, so it must stay
       the closed default, not be "fixed" to index at real launch — flip
       PUBLIC_LAUNCH in server/src/index.ts (VITE_LAUNCH_MODE=public)
       instead. -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/illustrations/Fav.svg" />
  <!-- Applies a saved light/dark choice before first paint, so there's no
       flash of the wrong theme while main.tsx's module script (deferred by
       `type="module"`) is still loading. "system" (no localStorage key)
       intentionally sets no attribute — index.css's own
       `prefers-color-scheme` media query already handles that case. -->
  <script>
    (function () {
      var t = localStorage.getItem("hello-circle-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <title>Hello Circle — community centres & sports clubs in Ireland</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
