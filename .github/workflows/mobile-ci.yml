name: Mobile CI

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace apps/mobile
      - run: npm run lint --workspace apps/mobile
      - run: npm run test --workspace apps/mobile

# No `eas build` step here — that needs an EAS account (external human
# signup, same category as the pending Apple Developer/Play Console
# accounts in MOBILE_SETUP.md). This workflow only guards the code itself.
